  <text x="600" y="386" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="300" letter-spacing="0.32em" fill="#8A8A8A">DATING WITHOUT THE UNWRITTEN RULES</text>
